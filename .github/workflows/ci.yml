name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Bundled script is up to date
        if: matrix.node == 22
        run: |
          npm run build
          git diff --exit-code -- skills/docentric/scripts
      - run: npm run test:run
      - run: npm run package

  # The skill's script must run where Claude runs it: no npm install, oldest supported Node.
  skill-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run every command of the bundled script
        shell: bash
        run: |
          s=skills/docentric/scripts/docentric.mjs
          node $s --version
          node $s doctor
          node $s inspect examples/SalesInvoice.docx --schema > /dev/null
          node $s validate examples/SalesInvoice.docx
          node $s preview examples/SalesInvoice.docx --out out --formats html,docx
          node $s edit examples/SalesInvoice.docx examples/SalesInvoice.edit.yaml --out out/Edited.docx
          node $s create examples/sales-invoice.yaml out/Created.docx
          node $s convert-ssrs examples/ssrs/ConInvoice.AxReport.xml out/ConInvoice.docx
          node $s dump out/Edited.docx > /dev/null
